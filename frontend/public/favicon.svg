  <defs>
    <linearGradient id="a" x1="0.25" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="o" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="#121b2a"/>
  <rect x="0.7" y="0.7" width="46.6" height="46.6" rx="11.4" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.8 34.8 L15.2 13.2 L22.6 34.8" stroke="url(#a)" stroke-width="5.6"/>
